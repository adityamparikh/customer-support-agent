name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live_it:
        description: "Also run the paid live integration tests (-Plive-it). Spends OpenAI and Anthropic credit."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every check the repo has, without API keys: Error Prone (-Werror) and javac,
  # the keyless unit and wiring tests, and the Spotless format check.
  # The paid integration tests are skipped by default (docs/adr/0004-paid-tests-are-opt-in.md).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build, lint, format check and keyless tests
        run: ./mvnw -B install
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: target/surefire-reports/

  # Manual only, and meant to wait for a reviewer: the live-api environment should have
  # required reviewers and hold OPENAI_API_KEY and ANTHROPIC_API_KEY (AINE-SETTINGS-TODO.md).
  live-it:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_it
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: live-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Live integration tests (paid)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: ./mvnw -B verify -Plive-it
      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failsafe-reports
          path: target/failsafe-reports/
